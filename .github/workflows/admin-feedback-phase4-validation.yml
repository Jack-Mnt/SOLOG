name: Admin Feedback Phase 4 Validation

on:
  push:
    branches:
      - admin-work
    paths-ignore:
      - ".validation/admin-feedback-phase4.txt"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout admin-work
        uses: actions/checkout@v4
        with:
          ref: admin-work
          fetch-depth: 100

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run phase 4 validation
        shell: bash
        run: |
          set +e
          mkdir -p .validation

          bun test --reporter=dot > /tmp/full.log 2>&1
          full_status=$?

          bun test \
            tests/admin-feedback.test.ts \
            tests/admin-management.test.ts \
            tests/admin-management-isolation.test.ts \
            tests/admin-catalog-v3.store.test.ts \
            tests/admin-catalog-v3.structure.test.ts \
            tests/admin-catalog-v3.integration.test.ts \
            tests/admin-products-masterdata.test.ts \
            tests/admin-incidents-multisite.test.ts \
            tests/admin-shell-devices.test.ts \
            tests/admin-primitives-post-review.test.ts > /tmp/targeted.log 2>&1
          targeted_status=$?

          bun run lint > /tmp/lint.log 2>&1
          lint_status=$?

          bun run build > /tmp/build.log 2>&1
          build_status=$?

          git diff --check 37ff4dc3522e2bd1e3260b8adaa01b16f82c8822...HEAD -- . ':(exclude).validation/**' ':(exclude).github/workflows/admin-feedback-phase4-validation.yml' > /tmp/diff.log 2>&1
          diff_status=$?

          {
            echo "=== operation_id / replay references in Admin source ==="
            rg -n 'operation_id|replay confirmado|\(replay\)|result\.replay|receipt\.operationId' src/features/solog/admin || true
            echo
            echo "=== feedback surfaces in scoped modules ==="
            rg -n 'MutationNotice|CatalogMutationNotice|AdminNotice|role="alert"|role="status"' \
              src/features/solog/admin/catalogo \
              src/features/solog/admin/productos \
              src/features/solog/admin/incidencias \
              src/features/solog/admin/dispositivos \
              src/features/solog/admin/admin.management.presentation.tsx || true
          } > /tmp/audit.log

          {
            echo "Admin Feedback Phase 4 Validation"
            echo "branch=admin-work"
            echo "commit=$(git rev-parse HEAD)"
            echo "full_status=$full_status"
            echo "targeted_status=$targeted_status"
            echo "lint_status=$lint_status"
            echo "build_status=$build_status"
            echo "diff_status=$diff_status"
            echo
            echo "=== FULL ==="
            cat /tmp/full.log
            echo
            echo "=== TARGETED ==="
            cat /tmp/targeted.log
            echo
            echo "=== LINT ==="
            cat /tmp/lint.log
            echo
            echo "=== BUILD ==="
            cat /tmp/build.log
            echo
            echo "=== DIFF CHECK ==="
            cat /tmp/diff.log
            echo
            echo "=== STATIC AUDIT ==="
            cat /tmp/audit.log
          } > .validation/admin-feedback-phase4.txt

      - name: Commit validation report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .validation/admin-feedback-phase4.txt
          git commit -m "chore: record admin feedback phase 4 validation" || exit 0
          git push origin HEAD:admin-work
