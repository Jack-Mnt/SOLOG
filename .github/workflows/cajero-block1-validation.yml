name: Cajero Block 1 Validation
# final browser smoke validation

on:
  push:
    branches:
      - admin-work
    paths:
      - ".github/workflows/cajero-block1-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Directed Cajero V4 tests
        run: >
          bun test
          tests/cajero-navigation-v4.test.ts
          tests/cajero-capability-selectors-v4.test.ts
          tests/cajero-flush-drafts-v4.test.ts
          tests/cajero-drafts-storage-v4.test.ts
          tests/cajero-runtime-v4.test.ts
          tests/cajero-queue-mapping-v4.test.ts
          tests/cajero-post-cutover-v4.test.ts

      - name: Full test suite
        continue-on-error: true
        run: bun test

      - name: Full suite excluding unrelated global G2 time-format contract
        run: |
          mapfile -t TEST_FILES < <(find tests -type f -name '*.test.ts' ! -name 'global-g2.test.ts' | sort)
          bun test "${TEST_FILES[@]}"

      - name: Install browser smoke dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Cajero V4 browser smoke
        run: |
          export SOLOG_PLAYWRIGHT_MODULE="$(node -p "require.resolve('playwright')")"
          export SOLOG_TEST_BROWSER="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          bun tests/cajero-v4.browser.mjs

      - name: Lint
        if: always()
        run: bun run lint

      - name: Build
        if: always()
        run: bun run build

      - name: Diff check
        if: always()
        run: git diff --check HEAD^ HEAD
