name: Dashboard Fase 6 - Validación puntual
# Intento 4: comprobar fix del lifecycle StrictMode con 789 tests, lint, build y browser.

# Ejecutar solo al modificar esta definición de CI. No lanzar builds por cada
# push de codigo en admin-work ni habilitar Cloudflare despliegues desde Actions.
on:
  push:
    branches: [admin-work]
    paths:
      - ".github/workflows/dashboard-phase6-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Instalar dependencias congeladas
        run: bun install --frozen-lockfile
      - name: Tests completos
        if: always()
        run: bun test --reporter=dot
      - name: Lint completo
        if: always()
        run: bun run lint
      - name: Typecheck y build
        if: always()
        run: bun run build
      - name: Git diff check desde baseline aprobado
        if: always()
        run: git diff --check 4cb3e9f4b63cc7c2de681ef70b8fa7d1bed47944 HEAD
      - name: 'Browser: instalar Chromium aislado'
        if: always()
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: 'Dashboard V1: navegador mock'
        if: always()
        run: |
          export SOLOG_PLAYWRIGHT_MODULE="$(node -p "require.resolve('playwright')")"
          export SOLOG_TEST_BROWSER="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          bun tests/admin-dashboard-v3.browser.mjs
      - name: 'Control V2: regresion de navegador mock'
        if: always()
        run: |
          export SOLOG_PLAYWRIGHT_MODULE="$(node -p "require.resolve('playwright')")"
          export SOLOG_TEST_BROWSER="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          bun tests/admin-v2.browser.mjs
