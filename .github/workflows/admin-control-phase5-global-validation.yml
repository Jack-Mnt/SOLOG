name: Admin Control Phase 5 Global Validation
# attempt 3

on:
  push:
    branches:
      - admin-work
    paths:
      - ".github/workflows/admin-control-phase5-global-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Full test suite
        run: bun test

      - name: Lint
        if: always()
        run: bun run lint

      - name: Build
        if: always()
        run: bun run build

      - name: Diff check full Control block
        if: always()
        run: git diff --check ee6197064c3555b4c2c576104bfe36794646dca2 HEAD
