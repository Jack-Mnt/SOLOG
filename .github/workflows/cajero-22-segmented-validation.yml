name: Cajero 2.2 Segmented Diff Validation

on:
  push:
    branches:
      - admin-work
    paths:
      - ".github/workflows/cajero-22-segmented-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff check
        run: git diff --check 6cebddfbbd67edf6040e7d6644f3910255ffea8c HEAD
