name: SOLOG Block 1 Validation

on:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Targeted Block 1 tests
        run: bun test tests/admin-incidents-multisite.test.ts tests/admin-management.test.ts tests/admin-management-isolation.test.ts --reporter=dot

      - name: Baseline G2 environment check
        continue-on-error: true
        run: |
          git worktree add /tmp/solog-baseline d4130809cd44add92367756cc0617dca8cbc1ec0
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/solog-baseline/node_modules
          cd /tmp/solog-baseline
          bun test tests/global-g2.test.ts --reporter=dot

      - name: Full test suite
        continue-on-error: true
        run: bun test --reporter=dot

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Diff whitespace
        run: |
          git diff --check
          git diff --check d4130809cd44add92367756cc0617dca8cbc1ec0...HEAD
