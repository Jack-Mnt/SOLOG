name: SOLOG Block 1 Validation

on:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Targeted Block 1 tests
        run: bun test tests/admin-incidents-multisite.test.ts tests/admin-management.test.ts tests/admin-management-isolation.test.ts --reporter=dot

      - name: Full test suite
        run: bun test --reporter=dot

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Diff whitespace
        run: |
          git diff --check
          git diff --check d4130809cd44add92367756cc0617dca8cbc1ec0...HEAD
