name: Cajero 2.7.1 Validation
# rerun after deterministic header assertion and whitespace cleanup

on:
  push:
    branches:
      - admin-work
    paths:
      - ".github/workflows/cajero-271-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Directed Cajero tests
        run: >
          bun test
          tests/cajero-c4.test.ts
          tests/cajero-error-policy-v4.test.ts
          tests/cajero-shared.test.ts
          tests/cajero-runtime-v4.test.ts
          tests/cajero-navigation-v4.test.ts
          tests/cajero-capability-selectors-v4.test.ts
          tests/cajero-queue-mapping-v4.test.ts
          tests/cajero-post-cutover-v4.test.ts

      - name: Install browser smoke dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Cajero V4 browser smoke
        run: |
          export SOLOG_PLAYWRIGHT_MODULE="$(node -p "require.resolve('playwright')")"
          export SOLOG_TEST_BROWSER="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          bun tests/cajero-v4.browser.mjs

      - name: Lint
        if: always()
        run: bun run lint

      - name: Build
        if: always()
        run: bun run build

      - name: Diff check
        if: always()
        run: git diff --check e146338f4814a00c042f449c762e344c501eadd5 HEAD
