name: Admin Feedback Phase 4 Final Validation

on:
  push:
    branches:
      - admin-work

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout admin-work
        uses: actions/checkout@v4
        with:
          ref: admin-work
          fetch-depth: 100

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Targeted feedback regression suite
        run: |
          bun test \
            tests/admin-feedback.test.ts \
            tests/admin-management.test.ts \
            tests/admin-management-isolation.test.ts \
            tests/admin-catalog-v3.store.test.ts \
            tests/admin-catalog-v3.structure.test.ts \
            tests/admin-catalog-v3.integration.test.ts \
            tests/admin-products-masterdata.test.ts \
            tests/admin-incidents-multisite.test.ts \
            tests/admin-shell-devices.test.ts \
            tests/admin-primitives-post-review.test.ts

      - name: Full suite matches inherited G2 baseline
        shell: bash
        run: |
          set +e
          bun test --reporter=dot > /tmp/full.log 2>&1
          status=$?
          set -e
          cat /tmp/full.log
          test "$status" -ne 0
          grep -Fq "379 pass" /tmp/full.log
          grep -Fq "9 fail" /tmp/full.log
          test "$(grep -c '^(fail) G2 presentación Lima' /tmp/full.log)" -eq 9
          if grep '^(fail)' /tmp/full.log | grep -v 'G2 presentación Lima'; then
            echo "Unexpected non-G2 failure detected."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Diff check from closed Block 3
        run: git diff --check 37ff4dc3522e2bd1e3260b8adaa01b16f82c8822...HEAD -- . ':(exclude).github/workflows/admin-feedback-phase4-final-validation.yml'

      - name: Static feedback audit
        shell: bash
        run: |
          if grep -RInE 'replay confirmado|\(replay\)' src/features/solog/admin --include='*.tsx'; then
            echo "Visible replay technical noise found."
            exit 1
          fi
          if grep -RInE 'payload\.operation_id\s*\}|operation_id\s*\}\s*</' \
            src/features/solog/admin/catalogo \
            src/features/solog/admin/productos \
            src/features/solog/admin/incidencias \
            src/features/solog/admin/dispositivos \
            --include='*.tsx'; then
            echo "Visible operation_id found."
            exit 1
          fi
          grep -Fq '{!confirmation && <MutationNotice domain="devices" />}' src/features/solog/admin/dispositivos/admin.dispositivos.v2.tsx
          grep -Fq 'noticeMessage && !mutationModalOpen' src/features/solog/admin/incidencias/admin.incidencias.v2.tsx
          grep -Fq 'intent && !setup && !price && <CatalogMutationNotice' src/features/solog/admin/catalogo/admin.catalogo.page.v3.tsx
          grep -Fq 'onDismiss={pendingIntent ? undefined' src/features/solog/admin/incidencias/admin.incidencias.v2.tsx
