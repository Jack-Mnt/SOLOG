name: Admin Control Phase 4 Validation
# attempt 4

on:
  push:
    branches:
      - admin-work
    paths:
      - ".github/workflows/admin-control-phase4-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Directed Control tests
        run: >
          bun test
          tests/admin-control-v3.test.ts
          tests/admin-v2.test.ts
          tests/admin-v2-isolation.test.ts
          tests/admin-drawers-8-2b.test.ts

      - name: Install browser dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Control browser validation
        run: |
          export SOLOG_PLAYWRIGHT_MODULE="$(node -p "require.resolve('playwright')")"
          export SOLOG_TEST_BROWSER="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export SOLOG_CONTROL_UI_ONLY=1
          bun tests/admin-control-v3.browser.mjs

      - name: Lint
        if: always()
        run: bun run lint

      - name: Build
        if: always()
        run: bun run build

      - name: Diff check
        if: always()
        run: git diff --check 15a9c445cac5fa225446e5b2cd66cb82db3f98d4 HEAD
