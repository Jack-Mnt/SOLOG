name: Cajero 2.2 Diff Validation

on:
  push:
    branches:
      - admin-work
    paths:
      - ".github/workflows/cajero-22-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff check
        run: git diff --check 1cc437dee835b1a4b1d56530af6ddbf66d0c0a87 HEAD
