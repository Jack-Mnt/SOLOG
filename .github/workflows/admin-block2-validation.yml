name: Admin Block 2 Validation

on:
  push:
    branches:
      - admin-work
    paths-ignore:
      - ".validation/admin-block2-validation.txt"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout admin-work
        uses: actions/checkout@v4
        with:
          ref: admin-work
          fetch-depth: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validation and write report
        shell: bash
        run: |
          set +e
          mkdir -p .validation

          bun test tests/admin-incidents-multisite.test.ts tests/admin-management.test.ts tests/admin-management-isolation.test.ts > /tmp/targeted.log 2>&1
          targeted_status=$?

          bun test --reporter=dot > /tmp/full.log 2>&1
          full_status=$?

          bun run lint > /tmp/lint.log 2>&1
          lint_status=$?

          bun run build > /tmp/build.log 2>&1
          build_status=$?

          git diff --check HEAD~6..HEAD > /tmp/diff.log 2>&1
          diff_status=$?

          {
            echo "Admin Block 2 Validation"
            echo "branch=admin-work"
            echo "commit=$(git rev-parse HEAD)"
            echo "targeted_status=$targeted_status"
            echo "full_status=$full_status"
            echo "lint_status=$lint_status"
            echo "build_status=$build_status"
            echo "diff_status=$diff_status"
            echo
            echo "=== TARGETED ==="
            cat /tmp/targeted.log
            echo
            echo "=== FULL ==="
            cat /tmp/full.log
            echo
            echo "=== LINT ==="
            cat /tmp/lint.log
            echo
            echo "=== BUILD ==="
            cat /tmp/build.log
            echo
            echo "=== DIFF CHECK ==="
            cat /tmp/diff.log
          } > .validation/admin-block2-validation.txt

      - name: Commit validation report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .validation/admin-block2-validation.txt
          git commit -m "chore: record admin block 2 validation" || exit 0
          git push origin HEAD:admin-work
